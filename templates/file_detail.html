<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Detail — DMARC Pipeline</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <div class="topbar-logo">D</div>
      <span>DMARC Pipeline</span>
    </div>
    <nav class="topbar-nav">
      <a href="/">Dashboard</a>
      <a href="/analysis">Analysis</a>
    </nav>
  </header>

  <div class="container">
    <!-- ── Breadcrumb ──────────────────────────────────────────────────────── -->
    <div class="detail-breadcrumb">
      <a href="/">Dashboard</a> → <span id="detail-filename">…</span>
    </div>

    <!-- ── Summary strip ───────────────────────────────────────────────────── -->
    <section class="card">
      <div class="card-header">
        <div class="card-title">Summary</div>
        <span id="detail-health-badge" class="badge">–</span>
      </div>
      <div class="card-body">
        <div id="summary-grid"></div>
      </div>
    </section>

    <!-- ── Failures & issues (why each failing sender failed) ──────────────── -->
    <section class="card" id="failures-card">
      <div class="card-header">
        <div class="card-title">Failures &amp; issues</div>
        <span id="failures-badge" class="badge">–</span>
      </div>
      <div class="card-body">
        <div id="failures-container"></div>
      </div>
    </section>

    <!-- ── Report metadata ─────────────────────────────────────────────────── -->
    <section class="card">
      <div class="card-header">
        <div class="card-title">Report metadata</div>
        <span id="detail-org" class="badge info"></span>
      </div>
      <div class="card-body">
        <div id="metadata-grid"></div>
      </div>
    </section>

    <!-- ── Policy published ────────────────────────────────────────────────── -->
    <section class="card">
      <div class="card-header">
        <div class="card-title">Policy published</div>
      </div>
      <div class="card-body">
        <div id="policy-grid"></div>
      </div>
    </section>

    <!-- ── Authentication alignment summary ─────────────────────────────────── -->
    <section class="card">
      <div class="card-header">
        <div class="card-title">Authentication alignment (by record)</div>
      </div>
      <div class="card-body">
        <div id="alignment-summary"></div>
      </div>
    </section>

    <!-- ── Records (every single one, fully detailed) ──────────────────────── -->
    <section class="card">
      <div class="card-header">
        <div class="card-title">All records</div>
        <span id="detail-record-count" class="badge info">0 records</span>
      </div>
      <div class="records-toolbar">
        <div class="records-filter" role="group" aria-label="Filter records">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="fail">Failed</button>
          <button type="button" class="filter-btn" data-filter="issue">Any issue</button>
          <button type="button" class="filter-btn" data-filter="pass">Passed</button>
        </div>
        <div class="records-toolbar-actions">
          <button type="button" class="filter-btn" id="expand-all">Expand all</button>
          <button type="button" class="filter-btn" id="collapse-all">Collapse all</button>
        </div>
      </div>
      <div id="records-container"></div>
    </section>
  </div>

  <script src="/static/file_detail.js"></script>
</body>
</html>
